        - "Australian startup raises funding {month_year}"
        - "New Zealand startup raises funding {month_year}"
      ru:
        - "стартап привлёк инвестиции {month_year}"

# Searches for shutdowns, pivots and stalls. Rotated week to week.
struggling_queries:
  en:
    - "startup shuts down {month_year}"
    - "startup pivots after failing {month_year}"
    - "startup winds down operations {month_year}"
  de:
    - "Startup Insolvenz {month_year}"
  pt:
    - "startup encerra operações {month_year}"
  ja:
    - "スタートアップ 事業停止 {month_year}"
  zh:
    - "初创公司 倒闭 停止运营 {month_year}"
  fr:
    - "startup ferme ses portes {month_year}"

# Searches about one named startup. {name} and {country} are filled in.
research_queries:
  en:
    - "\"{name}\" startup {country}"
    - "\"{name}\" founders funding customers"
  pt:
    - "\"{name}\" startup rodada investimento"
  es:
    - "\"{name}\" startup ronda inversión"
  fr:
    - "\"{name}\" start-up levée de fonds"
  de:
    - "\"{name}\" Startup Finanzierung Gründer"
  ja:
    - "\"{name}\" スタートアップ 資金調達"
  zh:
    - "\"{name}\" 创业公司 融资"
  ko:
    - "\"{name}\" 스타트업 투자"
  id:
    - "\"{name}\" startup pendanaan"
  tr:
    - "\"{name}\" girişim yatırım"
  he:
    - "\"{name}\" סטארטאפ גיוס"
