        - "startup levanta ronda semilla {month_year} México"
        - "startup levanta capital {month_year} Colombia Argentina Chile"
  mea:
    share: 0.07
    feeds:
      - {name: Wamda, url: "https://www.wamda.com/feed"}
      - {name: Disrupt Africa, url: "https://disrupt-africa.com/feed/"}
      - {name: TechCabal, url: "https://techcabal.com/feed/"}
      - {name: Geektime (he), url: "https://www.geektime.co.il/feed/"}
      - {name: Webrazzi (tr), url: "https://webrazzi.com/feed/"}
