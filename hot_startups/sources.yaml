# Where the program looks. Shares say how the discovery searches are split between regions.
# Feeds were checked on 16 September 2026; a feed that stops working is reported on the page, not skipped quietly.
# Query templates: {month_year} becomes e.g. "September 2026" in that language, {year} the year.

regions:
  north_america:
    share: 0.30
    feeds:
      - {name: TechCrunch startups, url: "https://techcrunch.com/category/startups/feed/"}
      - {name: Product Hunt, url: "https://www.producthunt.com/feed"}
      - {name: Y Combinator blog, url: "https://www.ycombinator.com/blog/rss/"}
    queries:
      en:
        - "startup raises seed round {month_year}"
        - "startup raises Series A {month_year} United States"
        - "most promising startups {year} United States"
        - "Y Combinator {season} {year} batch most interesting startups"
        - "Canada startup raises funding {month_year}"
        - "stealth startup emerges {month_year}"
  europe:
    share: 0.25
    feeds:
      - {name: Sifted, url: "https://sifted.eu/feed"}
      - {name: EU-Startups, url: "https://www.eu-startups.com/feed/"}
      - {name: Tech.eu, url: "https://tech.eu/feed/"}
      - {name: Maddyness (fr), url: "https://www.maddyness.com/feed/"}
      - {name: Gründerszene (de), url: "https://www.businessinsider.de/gruenderszene/feed/"}
      - {name: El Referente (es), url: "https://elreferente.es/feed/"}
      - {name: ArcticStartup, url: "https://arcticstartup.com/feed/"}
      - {name: Silicon Canals, url: "https://siliconcanals.com/feed/"}
    queries:
      en:
        - "European startup raises seed round {month_year}"
        - "most promising startups Europe {year}"
        - "UK startup raises funding {month_year}"
      de:
        - "Startup Finanzierungsrunde {month_year}"
        - "vielversprechendste Startups {year} Deutschland Österreich Schweiz"
      fr:
        - "startup lève des fonds {month_year}"
        - "startups prometteuses {year} France"
      es:
        - "startup cierra ronda de inversión {month_year} España"
      it:
