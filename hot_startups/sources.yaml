      nl:
        - "startup haalt investering op {month_year}"
      sv:
        - "startup tar in kapital {month_year}"
      pl:
        - "startup pozyskał finansowanie {month_year}"
  asia:
    share: 0.25
    feeds:
      - {name: Tech in Asia, url: "https://www.techinasia.com/feed"}
      - {name: The Bridge (ja), url: "https://thebridge.jp/feed"}
      - {name: Platum (ko), url: "https://platum.kr/feed"}
      - {name: Inc42, url: "https://inc42.com/feed/"}
      - {name: YourStory, url: "https://yourstory.com/feed"}
      - {name: e27, url: "https://e27.co/feed/"}
      - {name: DailySocial (id), url: "https://dailysocial.id/feed"}
      - {name: The Ken, url: "https://the-ken.com/feed/"}
    queries:
      en:
        - "Southeast Asia startup raises seed round {month_year}"
        - "India startup raises seed funding {month_year}"
        - "most promising startups Asia {year}"
      zh:
        - "初创公司 完成 种子轮 融资 {month_year}"
        - "最具潜力 创业公司 {year}"
      ja:
        - "スタートアップ 資金調達を実施 {month_year}"
        - "注目 スタートアップ {year}"
      ko:
        - "스타트업 시드 투자 유치 {month_year}"
      id:
        - "startup raih pendanaan {month_year}"
      vi:
        - "startup gọi vốn thành công {month_year}"
  latin_america:
    share: 0.08
    feeds:
      - {name: Startupi (pt), url: "https://startupi.com.br/feed/"}
      - {name: Contxto, url: "https://contxto.com/en/feed/"}
