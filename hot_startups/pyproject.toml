[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotstartups"
version = "0.1.0"
description = "Hot Startups: a weekly page of the world's highest-potential startups, explained simply, to spark ideas."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "feedparser>=6.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hotstartups = "hotstartups.cli:main"

[tool.setuptools.packages.find]
include = ["hotstartups*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
