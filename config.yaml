# Problem Scout configuration. Every value here has a default in scout/config.py;
# anything you omit falls back to that default.

default_since_days: 7             # default look-back for `scout collect`

classify:
  threshold: 4                    # signal points needed to flag an item as a problem (see scout/classify.py)

# Query terms per language. Sources that support search (HN, Reddit, Adzuna)
# run one query per term. Other sources are filtered client-side against them.
query_terms:
  en:
    - "is there a tool"
    - "why is there no"
    - "I wish"
    - "how do you handle"
    - "anyone else struggle"
    - "spreadsheet"
    - "manually"
    - "pain in the"
    - "looking for a solution"
    - "how do I find"
    - "workaround"
  ru:
    - "есть ли сервис"
    - "почему нет"
    - "как вы решаете"
    - "вручную"
    - "таблица"
    - "ищу решение"
    - "костыль"
  ar:
    - "هل يوجد"
    - "كيف تتعاملون مع"
    - "يدويا"
    - "ابحث عن حل"
  hi:
    - "koi tool hai"
    - "manually"
    - "kaise karte ho"

sources:
  hn:
    enabled: true
    languages: [en]               # HN is English; only these term lists are used
    tags: [comment, story]        # Algolia tag filters to query
    max_pages_per_query: 3        # 100 hits per page
    min_body_chars: 80

  reddit:
    enabled: true                 # skipped automatically if credentials are missing
    subreddits:
      - smallbusiness
      - Entrepreneur
      - startups
      - SaaS
      - sysadmin
      - Construction
      - Contractor
      - logistics
      - supplychain
      - freelance
      - Upwork
      - ecommerce
      - dubai
      - UAE
      - saudiarabia
      - india
      - Pikabu
    posts_per_subreddit: 100      # newest posts to scan per subreddit
    comments_per_post: 20         # top-level comments fetched per matching post
    max_posts_with_comments: 25   # cap on comment fetches per subreddit (rate limits)
    require_query_match: true     # keep only posts/comments containing a query term
    min_body_chars: 60

  producthunt:
    enabled: true                 # skipped automatically if PRODUCTHUNT_TOKEN is missing
    posts_per_run: 60
    comments_per_post: 20
    min_body_chars: 40

  appstore:
    enabled: true
    countries: [us, gb, ae, in, sa]
    max_rating: 2                 # keep reviews with rating <= this
    pages: 2                      # RSS pages per app/country (50 reviews per page)
    min_body_chars: 40
    apps:                         # category -> list of {id, name}
      small_business_ops:
        - {id: 584606479, name: "QuickBooks"}
        - {id: 441880705, name: "Xero"}
        - {id: 710446064, name: "Zoho Books"}
        - {id: 371294472, name: "Shopify"}
        - {id: 1023050786, name: "Square Appointments"}
        - {id: 1478804271, name: "Gusto"}
      field_service_construction:
        - {id: 1014146758, name: "Jobber"}
        - {id: 692833651, name: "Housecall Pro"}
        - {id: 374930542, name: "Procore"}
        - {id: 504370616, name: "Buildertrend"}
        - {id: 1037989976, name: "ServiceTitan"}
      freelance_hr_payroll:
        - {id: 1446736499, name: "Upwork"}
        - {id: 346080608, name: "Fiverr"}
        - {id: 6478083155, name: "Deel"}
        - {id: 1057593226, name: "Bayzat"}
      ecommerce_logistics:
        - {id: 794141485, name: "Amazon Seller"}
        - {id: 1097721446, name: "Flipkart Seller Hub"}
        - {id: 1534619962, name: "Etsy Seller"}
        - {id: 972151811, name: "ShipStation"}
        - {id: 1561306896, name: "Freightos"}
      payments_cross_border:
        - {id: 612261027, name: "Wise"}
        - {id: 663338402, name: "Payoneer"}
      india_sme:
        - {id: 668561641, name: "IndiaMART"}
        - {id: 6478382307, name: "Vyapar"}
        - {id: 1457958492, name: "Meesho"}
      gulf_consumer_platforms:
        - {id: 592978487, name: "Careem"}
        - {id: 451001072, name: "talabat"}
        - {id: 1269038866, name: "noon"}
        - {id: 892172848, name: "dubizzle"}
      beauty_booking:
        - {id: 1297230801, name: "Fresha"}
        - {id: 723961236, name: "Booksy"}

  youtube:
    enabled: true                 # skipped automatically if YOUTUBE_API_KEY is missing
    videos_per_channel: 5
    comments_per_video: 100
    require_query_match: true
    min_body_chars: 60
    channels:                     # industry -> list of {id, name}. Channel IDs start with "UC".
      example_industry: []        # e.g. - {id: "UCxxxxxxxxxxxxxxxxxxxxxx", name: "Channel name"}

  telegram:
    enabled: false                # requires TELEGRAM_API_ID/HASH and `pip install telethon`
    channels: []                  # public channel usernames, e.g. "@some_business_channel"
    messages_per_channel: 200
    require_query_match: true
    min_body_chars: 60

  adzuna:
    enabled: false                # requires ADZUNA_APP_ID/KEY
    countries: [gb, us, in, ae]   # Adzuna country codes
    queries:                      # job titles that signal manual work companies pay for
      - "data entry"
      - "manual reconciliation"
      - "spreadsheet"
      - "coordinator"
      - "back office"
    results_per_query: 50
    min_body_chars: 80

clustering:
  distance_threshold: 0.55        # cosine distance; lower = tighter clusters (0.45-0.65 useful)
  # Multilingual model so RU/AR/HI posts cluster with EN ones (~470 MB, downloaded once).
  # Faster English-only alternative: sentence-transformers/all-MiniLM-L6-v2
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  min_growth_denominator: 3

scoring:
  min_cluster_size: 3             # clusters smaller than this are not scored or ranked
  volume_cap: 50                  # item count at which the volume component saturates
  weights:                        # each component is 0..1; weights are normalised to sum to 1
    volume: 0.20
    growth: 0.12
    sources: 0.08
    languages: 0.08
    pain: 0.12
    money: 0.08
    demand: 0.08
    workaround: 0.04
    triangulation: 0.20           # from `scout triangulate` (0 until it has run)

# ---------------------------------------------------------------- news layer (why now)
news:
  max_per_feed: 50                # cap per feed per run
  catalyst_threshold: 2           # taxonomy points needed to count as a catalyst (scout/catalysts.py)
  fetch_full_text: false          # true = fetch article bodies with trafilatura (robots.txt honoured); slower
  google_news:
    enabled: true
    locales:                      # each query below runs once per locale of its language
      - {lang: en, gl: AE, ceid: "AE:en"}
      - {lang: en, gl: IN, ceid: "IN:en"}
      - {lang: en, gl: US, ceid: "US:en"}
      - {lang: ru, gl: RU, ceid: "RU:ru"}
      - {lang: ar, gl: AE, ceid: "AE:ar"}
      - {lang: ar, gl: SA, ceid: "SA:ar"}
      - {lang: hi, gl: IN, ceid: "IN:hi"}
    queries:
      en:
        - {q: "e-invoicing mandate", domain: "small business accounting"}
        - {q: "new regulation SMEs", domain: "small business"}
        - {q: "labour shortage construction", domain: "construction"}
        - {q: "shuts down operations", domain: "general"}
        - {q: "raises Series A logistics", domain: "logistics"}
        - {q: "mandatory compliance deadline", domain: "compliance"}
        - {q: "customs delays shortage", domain: "logistics"}
        - {q: "clinic licensing rules", domain: "clinic operations"}
      ru:
        - {q: "новые правила для бизнеса", domain: "small business"}
        - {q: "дефицит кадров", domain: "hiring"}
        - {q: "уходит с рынка", domain: "general"}
        - {q: "привлек инвестиции стартап", domain: "startups"}
        - {q: "обязательная маркировка", domain: "compliance"}
      ar:
        - {q: "قانون جديد الشركات الصغيرة", domain: "small business"}
        - {q: "نقص العمالة", domain: "hiring"}
        - {q: "الفوترة الإلكترونية", domain: "small business accounting"}
        - {q: "جولة تمويل", domain: "startups"}
      hi:
        - {q: "छोटे व्यापार नया नियम", domain: "small business"}
        - {q: "कमी मजदूर", domain: "hiring"}
        - {q: "फंडिंग स्टार्टअप", domain: "startups"}
  gdelt:
    enabled: true                 # free API, one request per language, spaced out; skipped when throttled
    max_records: 50
    spacing_seconds: 8
    phrases:
      en: ["e-invoicing mandate", "labour shortage", "exits the market", "new regulation for SMEs"]
      ru: ["дефицит кадров", "уходит с рынка", "новые требования для бизнеса"]
      ar: ["نقص العمالة", "الفوترة الإلكترونية", "قانون جديد"]
      hi: ["नया नियम व्यापार", "कमी"]
  feeds:                          # kind: press | regulatory | funding. Feeds verified live on 2026-09-09.
    - {name: "Economic Times SME", url: "https://economictimes.indiatimes.com/small-biz/rssfeeds/5575607.cms", kind: press, language: en, region: india, domain: "small business"}
    - {name: "Economic Times Top", url: "https://economictimes.indiatimes.com/rssfeedstopstories.cms", kind: press, language: en, region: india}
    - {name: "Mint Industry", url: "https://www.livemint.com/rss/industry", kind: press, language: en, region: india}
    - {name: "Mint Companies", url: "https://www.livemint.com/rss/companies", kind: press, language: en, region: india}
    - {name: "Kommersant", url: "https://www.kommersant.ru/RSS/news.xml", kind: press, language: ru, region: russian}
    - {name: "Vedomosti", url: "https://www.vedomosti.ru/rss/news", kind: press, language: ru, region: russian}
    - {name: "RBC", url: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss", kind: press, language: ru, region: russian}
    - {name: "TechCrunch", url: "https://techcrunch.com/feed/", kind: funding, language: en, region: us, domain: "startups"}
    - {name: "Sifted", url: "https://sifted.eu/feed", kind: funding, language: en, region: eu, domain: "startups"}
    - {name: "Tech in Asia", url: "https://www.techinasia.com/feed", kind: funding, language: en, region: asia, domain: "startups"}
    - {name: "RBI press releases", url: "https://www.rbi.org.in/pressreleases_rss.xml", kind: regulatory, language: en, region: india, domain: "banking"}
    - {name: "SEC press releases", url: "https://www.sec.gov/news/pressreleases.rss", kind: regulatory, language: en, region: us, domain: "capital markets"}
    - {name: "EU Commission press", url: "https://ec.europa.eu/commission/presscorner/api/rss?language=en", kind: regulatory, language: en, region: eu}
    # Blocked or without RSS when checked (403/404): Construction Week ME, Arabian Business, Gulf News, Zawya,
    # The National, The Information. Gulf coverage comes from the AE/SA Google News locales above.
    # UAE Federal Gazette, SAMA and CMA publish no RSS; add a Google News query for them if needed.

# ---------------------------------------------------------------- reports layer (category size, structural trends)
reports:
  since_days: 730                 # reports age slowly and the World Bank index lags by months; 2 years is sane
  data_dir: data/reports          # downloaded PDFs (git-ignored)
  max_pdf_mb: 25
  chunk_chars: 8000               # ~2,000 tokens per chunk
  fetch_html: true                # fetch full article text for publisher feeds (robots.txt honoured)
  max_per_publisher: 30
  prefilter_keywords:             # a chunk must contain one of these to be classified; skip rate is logged
    ["gap", "underserved", "fragmented", "manual", "inefficien", "shortage", "opportunity", "lack of", "no standard",
     "informal", "unmet", "пробел", "фрагмент", "вручную", "неэффективн", "дефицит", "возможност", "отсутств",
     "فجوة", "مجزأ", "يدوي", "غير فعال", "نقص", "فرصة", "कमी", "अकुशल", "अवसर", "खंडित"]
  worldbank:
    enabled: true
    rows: 20                      # newest documents per query
    confidence: 4
    queries:
      - "small and medium enterprises digital"
      - "logistics trade facilitation"
      - "construction sector productivity"
      - "informal economy"
      - "labor market Gulf"
      - "financial inclusion India"
      - "health services private sector"
      - "Uzbekistan Kazakhstan private sector"
  publishers:                     # insight feeds; confidence 1-5 (audited data 5 ... marketing 2)
    - {name: "McKinsey Insights", url: "https://www.mckinsey.com/insights/rss", confidence: 3, language: en, region: global}
    # No public RSS or blocked when checked: BCG, Bain, Deloitte Insights, PwC, EY, Kearney, Oliver Wyman,
    # Roland Berger, IMF, OECD, WEF, HSE, IBEF, KAPSARC, NITI Aayog, Redseer, Strategy& ME. Add any feed URL you
    # find as {name, url, confidence, language, region}; PDF enclosures are downloaded and chunked automatically.
  arxiv:
    enabled: true
    categories: [econ.GN, q-fin.GN]
    max_results: 50
    confidence: 3

triangulation:
  distance_threshold: 0.45        # cosine distance between a cluster summary and a claim/catalyst
  min_claim_confidence_for_hypothesis: 3
  min_catalyst_strength_for_hypothesis: 4


digest:
  top_n: 10
  quotes_per_cluster: 3
  quote_max_words: 25
  rising_growth_threshold: 2.0
  output_dir: digests
